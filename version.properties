# Single source of the version, read by app/build.gradle.kts without any fallback: a wrong version
# breaks the update on the user's phone (Android refuses a versionCode that goes down), so a build
# that fails loudly beats an APK published with a silently wrong code.
#
# versionCode here is the BASE. Each APK gets `base * 10 + ABI rank` (universal 0, armeabi-v7a 1,
# arm64-v8a 2, x86_64 3) — the scheme of Notes Tech 3.0.0 (docs D-011).
#
# Continuity with the Flutter line, which does NOT start again from zero (docs D-011, D-016):
#   Flutter publishes `abi * 1000 + versionCode` per ABI. The last release, 2.15.3 (21503), shipped
#   21503 (universal), 22503 (armeabi-v7a), 23503 (arm64-v8a) and 25503 (x86_64).
#   A port APK below the code of the APK a user installed would not install over it — and
#   uninstalling destroys the vault. Base 3000 gives 30000-30003, above all of them, and leaves room
#   for Flutter bug-fix releases during the port.
# ⚠️ Before publishing, compare with the LAST published Flutter tag, not with this comment.
versionCode=3001
versionName=3.0.1
