[versions]
# Chain of App Manager Tech and Agenda Tech (docs D-001), at the versions they run green with.
# Only what the code uses today: each later phase adds its own entries with the reason.

# --- Kotlin ---
# Capped below 2.4.20: CodeQL 2.27 refuses to compile from there (measured on Agenda Tech). The root
# build.gradle.kts pins the Kotlin Gradle Plugin to this EXACT version with `strictly`.
kotlin                  = "2.4.10"
ksp                     = "2.3.12"

# --- Android Gradle Plugin (Kotlin is built into AGP 9) ---
agp                     = "9.4.1"

# --- AndroidX ---
androidxCore            = "1.19.1"
androidxActivity        = "1.13.0"
androidxLifecycle       = "2.11.0"
# Phase 3, the screens: the versions of App Manager Tech and Notes Tech (they need AGP 9.1+ and compileSdk 37).
androidxNavigation      = "2.10.2"
composeBom              = "2026.09.00"
# Phase 4, the image viewer: the EXIF orientation below API 28, where ImageDecoder does not apply it.
# Not the framework's android.media.ExifInterface: lint flags its known security bugs on old Android
# versions, and Android 8 is exactly where this one runs, on any file opened. Apache-2.0 (its POM).
androidxExifInterface   = "1.4.2"
# Phase 4, the HTML viewer: WebViewAssetLoader, so that a page reaches the WebView through the app — its
# own bytes and its own folder only — never through file:// (inventory D20). No permission in its manifest
# (read in the AAR); Apache-2.0 (its POM). 1.17.1, published 2026-09-23: the latest stable, as lint wants.
androidxWebkit          = "1.18.0"
# The splash screen at launch, as Agenda Tech and App Manager Tech (same version): the logo on white, the
# platform's SplashScreen from Android 12 and the same look below. No permission and no component in its
# manifest (read in the AAR); Apache-2.0 (the AAR's own headers).
androidxSplashscreen    = "1.2.0"

# --- Hilt ---
hilt                    = "2.60.1"
hiltNavigationCompose   = "1.4.0"

# --- Coroutines ---
coroutines              = "1.11.0"

# --- Spreadsheets (docs D-006): the .xls (BIFF8) read by Apache POI's HSSF, the `poi` module ALONE —
# never poi-ooxml (+12 MB of jars, StAX absent from Android, java.awt through XSSFColor: D-015; the .xlsx
# has a reader of its own). Apache-2.0, as its dependencies (commons-codec, -collections4, -io, -math3,
# SparseBitSet, log4j-api), read in their POMs. 5.5.1 published 2025-11-26, measured by the prototype.
poi                     = "5.5.1"

# --- Markdown (phase 4, the Markdown viewer): commonmark-java parses to a tree the viewer lays out itself,
# never to HTML. BSD-2-Clause (its POM and LICENSE.txt), no dependency, maintained (a release every few
# months). Core, GFM tables and strikethrough: what the 2.15.3's gpt_markdown rendered. Its List.of / Set.of
# (Java 9) are backported by D8 below API 30. 0.30.0 published 2026-08-06; 0.30.1 is three days old.
commonmark              = "0.30.0"

# --- Patterns the user types (phase 5: content search, bulk rename): RE2/J matches in a time linear in the
# text, whatever the pattern. Android's java.util.regex is ICU's backtracking engine: `(a+)+$` on a file name
# runs for ever and nothing stops it — it copies its input to native memory, so no CharSequence of ours is
# read while it works. BSD-3-Clause (the "Go License" its POM names; LICENSE read on github.com/google/re2j),
# no dependency, no permission. 1.8 published 2025-01-09.
re2j                    = "1.8"

# --- OCR (phase 5, docs D-032): Tesseract 5.5.1, free, on the phone, offline — ML Kit, which reported each
# use through Google Play services, left the app. Tesseract4Android 4.9.0 (2025-06-11, the latest): its JNI
# binding and native builds of Tesseract (Apache-2.0), Leptonica (BSD-2-Clause), the IJG's libjpeg 9f (IJG
# licence) and libpng 1.6.48 (PNG Reference Library License v2) — each read at its source, all in NOTICE.
# Apache-2.0 itself (its LICENSE); no permission, no component in its manifest; one dependency,
# androidx.annotation. The STANDARD variant, not `-openmp`: one thread, so its progress callback runs on the
# thread that recognises (OcrEngine stops it from there). On JitPack only: settings.gradle.kts gives JitPack
# this group alone, gradle/verification-metadata.xml pins its bytes.
tesseract4android       = "4.9.0"

# --- Crypto (docs D-005): ONE BouncyCastle family for the vault KDFs and, later, PdfBox ---
bouncycastle            = "1.86"

# --- PDF (phase 4, the PDF viewer, docs D-005 and D-029): PdfBox-Android reads what PdfRenderer does not
# expose — the password of an encrypted file (decrypted to a private temporary) and the outline — and only
# in the `:pdf` process. Apache-2.0 (its POM). Its BouncyCastle `*-jdk15to18:1.72` is substituted by the
# one family above (app/build.gradle.kts). 2.0.27.0, published 2023, measured by the prototype (point 2).
pdfboxAndroid           = "2.0.27.0"

# --- Tests ---
junit                   = "6.1.3"
truth                   = "1.4.5"
# The real org.json in JVM tests: android.jar only carries stubs there. Same version as the prototype.
orgJson                 = "20260814"
# The XmlPull API (public domain) for the JVM tests of the document viewer: android.jar only carries stubs
# of org.xmlpull. The parser itself is Android's, copied unchanged from AOSP libcore (MIT,
# src/test/java/com/android/org/kxml2): kxml2 2.3.0 of Maven Central is an older upstream that Android
# forked, and it is not the same parser — measured, it truncates `&#x1F600;` to U+F600 where Android's
# appends the code point, and it skips a DTD Android parses. Tests only, never in the APK.
xmlpull                 = "1.1.3.1"
androidxTestCore        = "1.7.0"
androidxTestRunner      = "1.7.0"

# --- Static analysis (same version as the other Kotlin apps of the portfolio) ---
detekt                  = "1.23.8"

[libraries]
androidx-core-ktx                       = { group = "androidx.core",                   name = "core-ktx",                          version.ref = "androidxCore" }
androidx-activity-compose               = { group = "androidx.activity",               name = "activity-compose",                  version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",              name = "lifecycle-runtime-ktx",             version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",              name = "lifecycle-runtime-compose",         version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",              name = "lifecycle-viewmodel-compose",       version.ref = "androidxLifecycle" }
androidx-navigation-compose             = { group = "androidx.navigation",             name = "navigation-compose",                version.ref = "androidxNavigation" }
androidx-exifinterface                  = { group = "androidx.exifinterface",          name = "exifinterface",                     version.ref = "androidxExifInterface" }
androidx-webkit                         = { group = "androidx.webkit",                 name = "webkit",                            version.ref = "androidxWebkit" }
androidx-splashscreen                   = { group = "androidx.core",                   name = "core-splashscreen",                 version.ref = "androidxSplashscreen" }

compose-bom                             = { group = "androidx.compose",                name = "compose-bom",                       version.ref = "composeBom" }
compose-ui                              = { group = "androidx.compose.ui",             name = "ui" }
compose-ui-graphics                     = { group = "androidx.compose.ui",             name = "ui-graphics" }
compose-ui-tooling                      = { group = "androidx.compose.ui",             name = "ui-tooling" }
compose-ui-tooling-preview              = { group = "androidx.compose.ui",             name = "ui-tooling-preview" }
compose-material3                       = { group = "androidx.compose.material3",      name = "material3" }
compose-material-icons-extended         = { group = "androidx.compose.material",       name = "material-icons-extended" }

hilt-android                            = { group = "com.google.dagger",               name = "hilt-android",                      version.ref = "hilt" }
hilt-android-compiler                   = { group = "com.google.dagger",               name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose                 = { group = "androidx.hilt",                   name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }

coroutines-android                      = { group = "org.jetbrains.kotlinx",           name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
coroutines-test                         = { group = "org.jetbrains.kotlinx",           name = "kotlinx-coroutines-test",           version.ref = "coroutines" }

poi                                     = { group = "org.apache.poi",                  name = "poi",                               version.ref = "poi" }

commonmark                              = { group = "org.commonmark",                  name = "commonmark",                        version.ref = "commonmark" }
commonmark-ext-gfm-tables               = { group = "org.commonmark",                  name = "commonmark-ext-gfm-tables",         version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough        = { group = "org.commonmark",                  name = "commonmark-ext-gfm-strikethrough",  version.ref = "commonmark" }

re2j                                    = { group = "com.google.re2j",                 name = "re2j",                              version.ref = "re2j" }

bcprov                                  = { group = "org.bouncycastle",                name = "bcprov-jdk18on",                    version.ref = "bouncycastle" }
# Not declared as dependencies: the TARGETS of the substitution in app/build.gradle.kts (PdfBox-Android pulls
# bcpkix and bcutil in the jdk15to18 family, which duplicates bcprov-jdk18on's classes).
bcpkix                                  = { group = "org.bouncycastle",                name = "bcpkix-jdk18on",                    version.ref = "bouncycastle" }
bcutil                                  = { group = "org.bouncycastle",                name = "bcutil-jdk18on",                    version.ref = "bouncycastle" }

pdfbox-android                          = { group = "com.tom-roush",                   name = "pdfbox-android",                    version.ref = "pdfboxAndroid" }

tesseract4android                       = { group = "cz.adaptech.tesseract4android",   name = "tesseract4android",                 version.ref = "tesseract4android" }

# Tests — JUnit Jupiter. The platform launcher is declared and aligned through the BOM: without it
# Gradle runs the tests with the launcher it bundles, and on JUnit 6 the test task died with 0 test
# executed (App Manager Tech, Dependabot PR #6). Same fix as Notes Tech and Agenda Tech.
junit-bom                               = { group = "org.junit",                       name = "junit-bom",                         version.ref = "junit" }
junit-jupiter-api                       = { group = "org.junit.jupiter",               name = "junit-jupiter-api" }
junit-jupiter-engine                    = { group = "org.junit.jupiter",               name = "junit-jupiter-engine" }
junit-platform-launcher                 = { group = "org.junit.platform",              name = "junit-platform-launcher" }
junit-jupiter-params                    = { group = "org.junit.jupiter",               name = "junit-jupiter-params" }
org-json                                = { group = "org.json",                        name = "json",                              version.ref = "orgJson" }
xmlpull                                 = { group = "xmlpull",                         name = "xmlpull",                           version.ref = "xmlpull" }
truth                                   = { group = "com.google.truth",                name = "truth",                             version.ref = "truth" }

# Instrumented tests — JUnit 4 under AndroidJUnitRunner (it brings junit:junit itself).
androidx-test-core                      = { group = "androidx.test",                   name = "core",                              version.ref = "androidxTestCore" }
androidx-test-runner                    = { group = "androidx.test",                   name = "runner",                            version.ref = "androidxTestRunner" }

# Static analysis — the ktlint rule set, run by detekt
detekt-formatting                       = { group = "io.gitlab.arturbosch.detekt",     name = "detekt-formatting",                 version.ref = "detekt" }

[plugins]
android-application    = { id = "com.android.application",                    version.ref = "agp" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                   = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                    = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
detekt                 = { id = "io.gitlab.arturbosch.detekt",                version.ref = "detekt" }
