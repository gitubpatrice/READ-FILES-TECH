[versions]
# Chain of App Manager Tech and Agenda Tech (docs D-001), at the versions they run green with.
# Only what the code uses today: each later phase adds its own entries with the reason.

# --- Kotlin ---
# Capped below 2.4.20: CodeQL 2.27 refuses to compile from there (measured on Agenda Tech). The root
# build.gradle.kts pins the Kotlin Gradle Plugin to this EXACT version with `strictly`.
kotlin                  = "2.4.10"
ksp                     = "2.3.12"

# --- Android Gradle Plugin (Kotlin is built into AGP 9) ---
agp                     = "9.4.1"

# --- AndroidX ---
androidxCore            = "1.19.1"
androidxActivity        = "1.13.0"
androidxLifecycle       = "2.11.0"
# Phase 3, the screens: the versions of App Manager Tech and Notes Tech (they need AGP 9.1+ and compileSdk 37).
androidxNavigation      = "2.10.2"
composeBom              = "2026.09.00"
# Phase 4, the image viewer: the EXIF orientation below API 28, where ImageDecoder does not apply it.
# Not the framework's android.media.ExifInterface: lint flags its known security bugs on old Android
# versions, and Android 8 is exactly where this one runs, on any file opened. Apache-2.0 (its POM).
androidxExifInterface   = "1.4.2"

# --- Hilt ---
hilt                    = "2.60.1"
hiltNavigationCompose   = "1.4.0"

# --- Coroutines ---
coroutines              = "1.11.0"

# --- Crypto (docs D-005): ONE BouncyCastle family for the vault KDFs and, later, PdfBox ---
bouncycastle            = "1.86"

# --- Tests ---
junit                   = "6.1.3"
truth                   = "1.4.5"
# The real org.json in JVM tests: android.jar only carries stubs there. Same version as the prototype.
orgJson                 = "20260814"
# The XmlPull API (public domain) for the JVM tests of the document viewer: android.jar only carries stubs
# of org.xmlpull. The parser itself is Android's, copied unchanged from AOSP libcore (MIT,
# src/test/java/com/android/org/kxml2): kxml2 2.3.0 of Maven Central is an older upstream that Android
# forked, and it is not the same parser — measured, it truncates `&#x1F600;` to U+F600 where Android's
# appends the code point, and it skips a DTD Android parses. Tests only, never in the APK.
xmlpull                 = "1.1.3.1"
androidxTestCore        = "1.7.0"
androidxTestRunner      = "1.7.0"

# --- Static analysis (same version as the other Kotlin apps of the portfolio) ---
detekt                  = "1.23.8"

[libraries]
androidx-core-ktx                       = { group = "androidx.core",                   name = "core-ktx",                          version.ref = "androidxCore" }
androidx-activity-compose               = { group = "androidx.activity",               name = "activity-compose",                  version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",              name = "lifecycle-runtime-ktx",             version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",              name = "lifecycle-runtime-compose",         version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",              name = "lifecycle-viewmodel-compose",       version.ref = "androidxLifecycle" }
androidx-navigation-compose             = { group = "androidx.navigation",             name = "navigation-compose",                version.ref = "androidxNavigation" }
androidx-exifinterface                  = { group = "androidx.exifinterface",          name = "exifinterface",                     version.ref = "androidxExifInterface" }

compose-bom                             = { group = "androidx.compose",                name = "compose-bom",                       version.ref = "composeBom" }
compose-ui                              = { group = "androidx.compose.ui",             name = "ui" }
compose-ui-graphics                     = { group = "androidx.compose.ui",             name = "ui-graphics" }
compose-ui-tooling                      = { group = "androidx.compose.ui",             name = "ui-tooling" }
compose-ui-tooling-preview              = { group = "androidx.compose.ui",             name = "ui-tooling-preview" }
compose-material3                       = { group = "androidx.compose.material3",      name = "material3" }
compose-material-icons-extended         = { group = "androidx.compose.material",       name = "material-icons-extended" }

hilt-android                            = { group = "com.google.dagger",               name = "hilt-android",                      version.ref = "hilt" }
hilt-android-compiler                   = { group = "com.google.dagger",               name = "hilt-android-compiler",             version.ref = "hilt" }
hilt-navigation-compose                 = { group = "androidx.hilt",                   name = "hilt-navigation-compose",           version.ref = "hiltNavigationCompose" }

coroutines-android                      = { group = "org.jetbrains.kotlinx",           name = "kotlinx-coroutines-android",        version.ref = "coroutines" }
coroutines-test                         = { group = "org.jetbrains.kotlinx",           name = "kotlinx-coroutines-test",           version.ref = "coroutines" }

bcprov                                  = { group = "org.bouncycastle",                name = "bcprov-jdk18on",                    version.ref = "bouncycastle" }

# Tests — JUnit Jupiter. The platform launcher is declared and aligned through the BOM: without it
# Gradle runs the tests with the launcher it bundles, and on JUnit 6 the test task died with 0 test
# executed (App Manager Tech, Dependabot PR #6). Same fix as Notes Tech and Agenda Tech.
junit-bom                               = { group = "org.junit",                       name = "junit-bom",                         version.ref = "junit" }
junit-jupiter-api                       = { group = "org.junit.jupiter",               name = "junit-jupiter-api" }
junit-jupiter-engine                    = { group = "org.junit.jupiter",               name = "junit-jupiter-engine" }
junit-platform-launcher                 = { group = "org.junit.platform",              name = "junit-platform-launcher" }
junit-jupiter-params                    = { group = "org.junit.jupiter",               name = "junit-jupiter-params" }
org-json                                = { group = "org.json",                        name = "json",                              version.ref = "orgJson" }
xmlpull                                 = { group = "xmlpull",                         name = "xmlpull",                           version.ref = "xmlpull" }
truth                                   = { group = "com.google.truth",                name = "truth",                             version.ref = "truth" }

# Instrumented tests — JUnit 4 under AndroidJUnitRunner (it brings junit:junit itself).
androidx-test-core                      = { group = "androidx.test",                   name = "core",                              version.ref = "androidxTestCore" }
androidx-test-runner                    = { group = "androidx.test",                   name = "runner",                            version.ref = "androidxTestRunner" }

# Static analysis — the ktlint rule set, run by detekt
detekt-formatting                       = { group = "io.gitlab.arturbosch.detekt",     name = "detekt-formatting",                 version.ref = "detekt" }

[plugins]
android-application    = { id = "com.android.application",                    version.ref = "agp" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
hilt                   = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                    = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
detekt                 = { id = "io.gitlab.arturbosch.detekt",                version.ref = "detekt" }
