name: read_files_tech
description: "Couteau suisse Android pour vos fichiers : explorateur, lecteur universel, scanner, OCR, coffre-fort, conversion, anti-EXIF — 100 % local."
publish_to: 'none'
version: 2.15.0+21500

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Code partagé Files Tech.
  #
  # Dépendance git épinglée, et non `path: ../files_tech_core`. Un chemin relatif ne résout que
  # dans l'arborescence de développement, là où les dépôts frères sont côte à côte ; ailleurs — un
  # clone, une CI, un serveur de build — `pub get` échoue sur « could not find package
  # files_tech_core ». L'application était donc incompilable par quiconque n'a pas ces dossiers,
  # ce qui contredit le fait d'en publier les sources.
  #
  # Pire, c'était silencieux et non reproductible : `pubspec.lock` est passé de 0.3.2 à 0.3.4 sans
  # qu'une seule ligne de ce fichier ne change, parce que le dépôt voisin avait bougé sur le disque.
  # Les workflows clonaient `files_tech_core` en frère SANS `ref:`, donc sur sa branche par défaut :
  # reconstruire un tag ancien ne redonnait pas le même binaire.
  #
  # Épinglé à un commit, jamais à une branche — c'est ce qui rend le build reproductible.
  # Même patron que notes_tech (v2.0.2) et pdf_tech (v1.13.5).
  files_tech_core:
    git:
      url: https://github.com/gitubpatrice/files_tech_core.git
      ref: e631fc894a802477c7f9ebe6d34ec46a56dc88d5

  # Fichiers
  file_picker: ^11.0.0
  path_provider: ^2.1.4
  permission_handler: ^13.0.0
  # Les deux paquets suivants sont bloqués, mais PAS pour la même raison — le
  # commentaire précédent les attribuait tous deux à win32, ce qui n'était vrai
  # que pour l'un. Vérifié au solveur le 2026-08-09, pas déduit :
  #
  #   share_plus 13        bloqué par `files_tech_core`, qui épingle ^10.0.3.
  #                        Le déblocage se fait DANS files_tech_core, puis ici.
  #                        Il est partagé par tout le portefeuille : le bump y
  #                        engage les autres applications.
  #
  #   package_info_plus 10 exige win32 ^6.0.0 ; file_picker 11 déclare encore
  #                        win32 ^5.9.0. Blocage réellement en amont, levé par
  #                        file_picker 12 — en bêta à ce jour, donc écarté.
  #
  # `win32` ne concerne que la cible Windows, jamais construite ici : la CI ne
  # sort qu'un APK (`runs-on: ubuntu-latest` pour les trois workflows), même si
  # l'échafaudage `windows/` existe. Un `dependency_overrides` lèverait donc ce
  # blocage sans risque réel, au prix d'une résolution qui ne reflète plus ce
  # que pub garantit.
  #
  # Pas fait. La raison a changé le 2026-08-10 et mérite d'être écrite : il ne
  # s'agit plus de « rien n'en dépend » — syncfusion 34 en dépend désormais
  # (voir plus bas). Mais ce qu'on obtiendrait en franchissant l'entorse ne vaut
  # rien pour cette application. Un override qu'on pose « puisqu'il est sans
  # risque » finit par en couvrir un qui ne l'est pas.
  share_plus: ^10.0.3
  shared_preferences: ^2.3.2

  # Formats documents
  # XLSX + XLS. Fork communautaire de `excel`, dont la dernière version
  # (4.0.6, août 2024) ne lisait QUE le .xlsx tout en étant câblée sur .xls et
  # .ods — les deux affichaient « Fichier illisible ». Le fork lit réellement
  # le .xls (vérifié sur fixture BIFF8) ; l'ODS reste non supporté et est
  # désormais refusé explicitement, comme le .doc l'est déjà côté texte.
  excel_community: ^2.2.1
  csv: ^8.0.0                # CSV
  archive: ^4.0.9            # DOCX / ODT (ZIP + XML)
  webview_flutter: ^4.10.0   # rendu HTML
  # Importé explicitement : `html_viewer_screen` a besoin de
  # `AndroidWebViewController.setAllowFileAccess` pour que la CSP injectée
  # (chargée via loadHtmlString) puisse encore lire les ressources voisines
  # du document. Transitif via webview_flutter, mais un import direct doit
  # être déclaré directement.
  webview_flutter_android: ^4.13.0

  # Visualisation code
  flutter_highlight: ^0.7.0  # syntax highlighting

  # Outil couleur
  flutter_colorpicker: ^1.1.0

  # Markdown rendu (gpt_markdown : remplaçant maintenu de flutter_markdown archivé)
  gpt_markdown: ^1.0.0

  # Hash fichier
  crypto: ^3.0.3

  # Export PDF + viewer
  # Maintenus en 33 sciemment. La bascule d'`excel` vers `excel_community` a
  # bien leve le blocage `xml <7` qu'on leur attribuait, mais un second est
  # apparu en tentant la montee le 2026-08-10 — il n'etait dans aucune carte :
  #
  #   syncfusion_flutter_pdfviewer >= 33.2.13+1  ->  device_info_plus ^13.1.0
  #                                              ->  win32 ^6.0.1
  #   file_picker 11.0.3 (dernier stable)        ->  win32 ^5.9.0
  #
  # Le franchir demanderait soit un `dependency_overrides` sur win32, soit
  # `file_picker` 12 — encore en beta (12.0.0-beta.7 au 2026-08-10). Une beta
  # sur le selecteur de fichiers d'une application qui manipule le coffre
  # chiffre n'est pas un compromis acceptable.
  #
  # Et le gain serait nul : le changelog de la 34 ne porte, pour notre usage,
  # que la montee d'`xml` et un correctif d'horodatage sur la **signature PDF
  # externe**, que l'application n'utilise pas. Payer un risque reel pour zero
  # benefice n'a pas de sens.
  #
  # A rouvrir quand `file_picker` 12 sera stable — la, la montee sera gratuite.
  syncfusion_flutter_pdf: ^33.2.4
  syncfusion_flutter_pdfviewer: ^33.2.4

  # HTTP (utilisé par UpdateService pour GitHub Releases API)
  http: ^1.2.0

  # Dates
  intl: ^0.20.0

  # Liens externes (mailto / https) pour Aide & Support
  url_launcher: ^6.3.1

  # OCR on-device (texte depuis images)
  google_mlkit_text_recognition: ^0.16.0

  # Scanner de documents (caméra + détection bords + perspective + PDF)
  google_mlkit_document_scanner: ^0.5.0

  # EPUB : extraction de texte / chapitres
  html: ^0.15.4

  # Manipulation images (compression, conversion)
  image: ^4.1.3
  image_picker: ^1.1.2

  # Utilitaires path / pointycastle pour PBKDF2
  pointycastle: ^4.0.0
  path: ^1.9.0

  # Version de l'app — source unique depuis pubspec
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  # 25 % d'inset pour respecter la "safe zone" Android adaptive icons :
  # le foreground source remplit tout le canvas, sans padding l'icône
  # apparaît zoomée car les launchers recadrent ~25 % de chaque côté.
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/legal/
