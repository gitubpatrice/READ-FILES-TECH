name: read_files_tech
description: "Couteau suisse Android pour vos fichiers : explorateur, lecteur universel, scanner, OCR, coffre-fort, conversion, anti-EXIF — 100 % local."
publish_to: 'none'
version: 2.15.2+21502

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Code partagé Files Tech.
  #
  # Dépendance git épinglée, et non `path: ../files_tech_core`. Un chemin relatif ne résout que
  # dans l'arborescence de développement, là où les dépôts frères sont côte à côte ; ailleurs — un
  # clone, une CI, un serveur de build — `pub get` échoue sur « could not find package
  # files_tech_core ». L'application était donc incompilable par quiconque n'a pas ces dossiers,
  # ce qui contredit le fait d'en publier les sources.
  #
  # Pire, c'était silencieux et non reproductible : `pubspec.lock` est passé de 0.3.2 à 0.3.4 sans
  # qu'une seule ligne de ce fichier ne change, parce que le dépôt voisin avait bougé sur le disque.
  # Les workflows clonaient `files_tech_core` en frère SANS `ref:`, donc sur sa branche par défaut :
  # reconstruire un tag ancien ne redonnait pas le même binaire.
  #
  # Épinglé à un commit, jamais à une branche — c'est ce qui rend le build reproductible.
  # Même patron que notes_tech (v2.0.2) et pdf_tech (v1.13.5).
  files_tech_core:
    git:
      url: https://github.com/gitubpatrice/files_tech_core.git
      ref: ef100ddda7f841361839a0e30578113db22cd599

  # Fichiers
  # 13.x depuis le 2026-09-20. Maillon de la meme transaction que `share_plus`
  # et `package_info_plus` : la 11.x exige win32 ^5.9.0, la 13.x win32 ^6.3.0,
  # et le solveur refuse tout etat intermediaire. Les trois montent ensemble.
  #
  # La 13 eclate le paquet par plateforme (file_picker_darwin / _linux / _web /
  # windows_file_picker) et change deux choses cote appel :
  #
  #   - `pickFiles` rend une `List<PlatformFile>` non nullable, plus un
  #     `FilePickerResult?` : `res.files` et le test `res == null` disparaissent ;
  #   - `allowMultiple` n'existe plus, car `pickFiles` envoie TOUJOURS
  #     `allowMultiple: true` au natif (android_file_picker 2.0.0, ligne 76).
  #
  # Cette seconde regle est un piege : les quatre ecrans mono-fichier lisaient
  # `res.files.single`, et `.single` LEVE des que la liste en contient deux.
  # Migres vers `FilePicker.pickFile()` (singulier, ajoute en 13), qui rend un
  # `PlatformFile?` et envoie `allowMultiple: false` — donc comportement
  # identique a la 11, sans changement d'UX ni risque de StateError.
  # `getDirectoryPath()` est inchange.
  file_picker: ^13.1.0
  path_provider: ^2.1.4
  permission_handler: ^13.0.0
  # Débloqué le 2026-09-20. Le commentaire précédent tenait ce blocage pour une
  # fatalité amont attribuée à `file_picker` ; mesuré au solveur, la racine
  # était dans un fichier que nous possédons — `files_tech_core` épinglait
  # `share_plus: ^10.0.3`, et toute la chaîne en découlait :
  #
  #   share_plus ^10  ->  win32 ^5.5.3
  #                   ->  bloque package_info_plus 10 (exige win32 ^6.0.1)
  #                   ->  bloque file_picker 13        (exige win32 ^6.3.0)
  #                   ->  bloque syncfusion 34
  #
  # Aucun `dependency_overrides` n'a été posé, et le refus de principe écrit
  # ici auparavant reste valable : un override qu'on pose « puisqu'il est sans
  # risque » finit par en couvrir un qui ne l'est pas. Le verrou a été levé à
  # sa source, pas contourné.
  #
  # La classe `Share` existe toujours en 13.3.0 mais y est @Deprecated dans son
  # ensemble : les 28 sites d'appel de cette application sont passés à
  # `SharePlus.instance.share(ShareParams(...))` dans le même commit, pour ne
  # pas laisser une API condamnée derrière un avertissement.
  share_plus: ^13.3.0
  shared_preferences: ^2.3.2

  # Formats documents
  # XLSX + XLS. Fork communautaire de `excel`, dont la dernière version
  # (4.0.6, août 2024) ne lisait QUE le .xlsx tout en étant câblée sur .xls et
  # .ods — les deux affichaient « Fichier illisible ». Le fork lit réellement
  # le .xls (vérifié sur fixture BIFF8) ; l'ODS reste non supporté et est
  # désormais refusé explicitement, comme le .doc l'est déjà côté texte.
  excel_community: ^2.2.1
  csv: ^8.0.0                # CSV
  archive: ^4.0.9            # DOCX / ODT (ZIP + XML)
  webview_flutter: ^4.10.0   # rendu HTML
  # Importé explicitement : `html_viewer_screen` a besoin de
  # `AndroidWebViewController.setAllowFileAccess` pour que la CSP injectée
  # (chargée via loadHtmlString) puisse encore lire les ressources voisines
  # du document. Transitif via webview_flutter, mais un import direct doit
  # être déclaré directement.
  webview_flutter_android: ^4.13.0

  # Visualisation code
  flutter_highlight: ^0.7.0  # syntax highlighting

  # Outil couleur
  flutter_colorpicker: ^1.1.0

  # Markdown rendu (gpt_markdown : remplaçant maintenu de flutter_markdown archivé)
  gpt_markdown: ^1.0.0

  # Hash fichier
  crypto: ^3.0.3

  # Export PDF + viewer
  #
  # 34.x depuis le 2026-09-20. Le blocage qui les tenait en 33 est leve : il
  # venait de `win32 ^5` impose par `file_picker` 11, lui-meme maintenu par la
  # chaine `share_plus ^10` decrite plus haut. `file_picker` 13 etant stable et
  # la chaine debloquee a sa source, la montee ne coute plus ni override ni
  # version beta.
  #
  # Ce que la 34 apporte reellement pour cette application reste mince — la
  # montee d'`xml` et un correctif d'horodatage sur la signature PDF EXTERNE,
  # que l'application n'utilise pas. Elle est prise parce qu'elle est devenue
  # gratuite, pas parce qu'elle etait attendue : rester en 33 aurait laisse une
  # dette documentee derriere un blocage qui n'existe plus.
  #
  # Surface touchee, a verifier sur appareil et non seulement a la compilation :
  # visionneuse PDF, images -> PDF, texte -> PDF, PDF -> TXT, et la pose de
  # signature (`pdf_signature_service.dart`, `signature_place_screen.dart`).
  syncfusion_flutter_pdf: ^34.2.8
  syncfusion_flutter_pdfviewer: ^34.2.8

  # HTTP (utilisé par UpdateService pour GitHub Releases API)
  http: ^1.2.0

  # Dates
  intl: ^0.20.0

  # Liens externes (mailto / https) pour Aide & Support
  url_launcher: ^6.3.1

  # OCR on-device (texte depuis images)
  google_mlkit_text_recognition: ^0.17.1

  # Scanner de documents (caméra + détection bords + perspective + PDF)
  google_mlkit_document_scanner: ^0.6.1

  # EPUB : extraction de texte / chapitres
  html: ^0.15.4

  # Manipulation images (compression, conversion)
  image: ^4.1.3
  image_picker: ^1.1.2

  # Utilitaires path / pointycastle pour PBKDF2
  pointycastle: ^4.0.0
  path: ^1.9.0

  # Version de l'app — source unique depuis pubspec.
  #
  # 10.x depuis le 2026-09-20. Ce bump n'est pas separable de celui de
  # `share_plus` : la 9.x depend de win32 ^5.5.3 et la 13.x de win32 ^6.0.1,
  # donc le solveur refuse tout etat intermediaire. Les deux montent ensemble
  # ou aucune ne monte.
  #
  # API inchangee pour notre usage : `PackageInfo.fromPlatform()`, appele en
  # `about_screen.dart:23` et `services/app_update.dart:15`.
  #
  # PLAFOND < 10.1.0, et ce n'est pas de la prudence : a partir de la 10.1.0 le
  # plugin passe a un `android/build.gradle.kts` ecrit pour AGP 9, dont le repli
  # `if (agpMajor < 9)` ne fonctionne PAS ici. Mesure sur build propre : les
  # classes Kotlin sont bien compilees dans `tmp/kotlin-classes/`, mais le
  # `classes.jar` livre a l'application ne contient que `R.class`, et javac
  # echoue sur `GeneratedPluginRegistrant.java` avec
  # « cannot find symbol: class PackageInfoPlugin ».
  #
  # Ni `flutter clean`, ni l'arret du demon Gradle n'y changent rien — l'echec
  # est reproductible. Le plafond tombe le jour ou le projet passe a AGP 9
  # (il est en 8.11.1, settings.gradle:22), pas avant.
  package_info_plus: ">=10.0.0 <10.1.0"

  # Jamais importe par cette application : dependance TRANSITIVE de
  # `syncfusion_flutter_pdfviewer`, declaree ici uniquement pour poser un
  # plafond que le solveur ne devinerait pas.
  #
  # Meme defaut que `package_info_plus` ci-dessus : la 13.2.0 adopte la recette
  # AGP 9 et son `classes.jar` sort vide de sa classe de plugin, d'ou un
  # « cannot find symbol: class DeviceInfoPlusPlugin ». La 13.1.0 utilise encore
  # l'ancien `build.gradle`, satisfait le `^13.1.0` exige par syncfusion, et
  # compile. Plancher 13.0.0 : en deca, win32 ^5 rouvre tout le verrou.
  #
  # A retirer entierement lors du passage a AGP 9.
  device_info_plus: ">=13.0.0 <13.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  # 25 % d'inset pour respecter la "safe zone" Android adaptive icons :
  # le foreground source remplit tout le canvas, sans padding l'icône
  # apparaît zoomée car les launchers recadrent ~25 % de chaque côté.
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/legal/
