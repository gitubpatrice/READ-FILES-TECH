# Project-wide Gradle settings for Read Files Tech (Kotlin port).

# AndroidX (mandatory for Compose / Material 3 / Hilt). The CI runner does not inject it the way
# Android Studio does (measured on App Manager Tech, v0.1.2).
android.useAndroidX=true
android.enableJetifier=false

# Build performance.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.code.style=official

# Non-transitive R classes keep each R class to its own module's resources.
android.nonTransitiveRClass=true
