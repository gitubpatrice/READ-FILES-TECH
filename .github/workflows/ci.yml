name: CI

on:
  push:
    # Les branches de travail etaient invisibles de la CI : une branche
    # `fix/**` pouvait accumuler des dizaines de commits sans qu'aucun outil
    # ne tourne. Modele repris d'Agenda Tech, seul depot du portefeuille a
    # declencher sur les branches de travail.
    branches: [main, 'fix/**', 'feat/**']
  pull_request:

jobs:
  build:
    name: Analyze + Test + Build (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout app
        uses: actions/checkout@v6
        with:
          path: read_files_tech

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: read_files_tech
        run: flutter pub get

      - name: Analyze
        working-directory: read_files_tech
        run: flutter analyze --no-fatal-infos

      # W-M3 / Q-H2 — le « || echo "No tests yet" » rendait cette etape
      # incapable d'echouer : un test rouge passait la CI au vert. Il datait
      # d'une epoque sans tests ; il y en a 83 aujourd'hui, dont 25 sur le
      # coffre.
      - name: Run tests
        working-directory: read_files_tech
        run: flutter test

      - name: Build APK (debug, unsigned)
        working-directory: read_files_tech
        run: flutter build apk --debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: read_files_tech-debug-${{ github.sha }}
          path: read_files_tech/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: ignore
